<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기안문 작성 도우미 (AI Powered)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        body { font-family: 'Noto Sans KR', sans-serif; }
        .preview-wrapper { background-color: #e5e7eb; padding: 2rem; height: 100%; overflow-y: auto; display: flex; justify-content: center; }
        .a4-page {
            background-color: white; width: 210mm; min-height: 297mm; padding: 25mm 20mm;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); color: #000;
            font-family: 'Malgun Gothic', sans-serif; line-height: 1.6; font-size: 11pt;
            word-break: keep-all; user-select: text; /* 복사 가능하도록 설정 */
        }
        .a4-page h1 { font-size: 2.2em; font-weight: bold; text-align: center; margin-bottom: 30px; }
        .a4-page h2 { font-size: 1.4em; font-weight: bold; margin-top: 25px; margin-bottom: 10px; border-bottom: 1px solid #eee; }
        .a4-page table { border-collapse: collapse; width: 100%; margin: 15px 0; border: 1px solid #000; }
        .a4-page th, .a4-page td { border: 1px solid #000; padding: 8px; vertical-align: middle; }
        .a4-page th { background-color: #f3f4f6; }
        .loader { border: 3px solid #f3f3f3; border-radius: 50%; border-top: 3px solid #3b82f6; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900">기안문 작성 도우미</h1>
            </div>
            <div class="text-sm text-gray-500">Powered by Gemini</div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="lg:col-span-1 space-y-6">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold mb-4">설정</h2>
                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gemini API(Application Programming Interface) Key</label>
                        <input type="password" id="apiKeyInput" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="API 키 입력">
                        <p class="text-xs text-gray-500 mt-1" id="keyStatus">키는 브라우저에 안전하게 저장됩니다.</p>
                    </div>
                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-xs text-blue-800">
                        <p class="font-medium mb-1">지원 기능:</p>
                        <ul class="list-disc list-inside space-y-1">
                            <li>다중 파일 업로드 (PDF, Word, Excel, 이미지)</li>
                            <li><strong>구형 Word(.doc) 지원</strong> (텍스트 추출 방식)</li>
                            <li>텍스트 인식 불가 시 자동 이미지 분석</li>
                        </ul>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold mb-4">파일 업로드</h2>
                    <label id="dropZone" for="multiFile" class="flex flex-col items-center justify-center w-full h-32 border-2 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100">
                        <p class="text-sm text-gray-500">클릭 또는 파일 드래그</p>
                        <p class="text-xs text-gray-400 mt-1">PDF, DOCX, DOC, XLSX, JPG, PNG</p>
                        <input id="multiFile" type="file" class="hidden" multiple accept=".pdf,.docx,.doc,.xlsx,.xls,.jpg,.jpeg,.png" />
                    </label>
                    <div id="fileList" class="mt-4 space-y-2 text-sm hidden"></div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold mb-4">추가 요청사항</h2>
                    <textarea id="userInstruction" rows="3" class="w-full px-3 py-2 border rounded-lg text-sm" placeholder="예: 구체적인 수치를 강조해줘"></textarea>
                </div>

                <button id="generateBtn" disabled class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 rounded-xl flex items-center justify-center gap-2">
                    <span id="btnText">기안문 생성하기</span>
                    <div id="spinner" class="loader hidden"></div>
                </button>
            </div>

            <div class="lg:col-span-2 flex flex-col min-h-[600px]">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                    <div class="border-b px-6 py-4 flex items-center justify-between bg-gray-50">
                        <h2 class="font-semibold text-gray-900">📄 문서 미리보기 (복사 가능)</h2>
                        <button id="downloadBtn" disabled class="text-sm bg-white border px-4 py-2 rounded-lg hover:bg-gray-50">Word 다운로드</button>
                    </div>
                    <div class="preview-wrapper" id="previewWrapper">
                        <div id="previewContainer" class="a4-page">
                            <p class="text-gray-400 text-center mt-20">파일을 업로드하고 생성을 눌러주세요.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        const apiKeyInput = document.getElementById('apiKeyInput');
        const fileInput = document.getElementById('multiFile');
        const fileListDisplay = document.getElementById('fileList');
        const generateBtn = document.getElementById('generateBtn');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');
        
        let accumulatedParts = [];

        // API Key 관리
        apiKeyInput.addEventListener('change', () => {
            localStorage.setItem('gemini_api_key', apiKeyInput.value);
            checkEnableButton();
        });

        window.onload = () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) { apiKeyInput.value = savedKey; checkEnableButton(); }
        };

        // 파일 처리 라우터
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            accumulatedParts = [];
            fileListDisplay.innerHTML = '';
            fileListDisplay.classList.remove('hidden');

            for (const file of files) {
                const status = document.createElement('div');
                status.className = "p-2 bg-gray-100 rounded flex justify-between";
                status.innerHTML = `<span>${file.name}</span><span class="text-blue-500">분석 중...</span>`;
                fileListDisplay.appendChild(status);

                try {
                    await processFile(file);
                    status.querySelector('span:last-child').textContent = "완료";
                } catch (err) {
                    status.querySelector('span:last-child').textContent = "오류";
                    status.querySelector('span:last-child').className = "text-red-500";
                }
            }
            checkEnableButton();
        });

        async function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'pdf') await handlePdf(file);
            else if (ext === 'docx') await handleDocx(file);
            else if (ext === 'doc') await handleOldDoc(file); // [추가] 구형 Word 처리
            else if (['jpg', 'png', 'jpeg'].includes(ext)) await handleImage(file);
            else if (['xlsx', 'xls'].includes(ext)) await handleExcel(file);
        }

        // [신설] 구형 Word(.doc) 텍스트 추출 로직
        async function handleOldDoc(file) {
            const arrayBuffer = await file.arrayBuffer();
            const decoder = new TextDecoder('utf-16le');
            let text = decoder.decode(arrayBuffer);
            
            // 이진 데이터에서 한글, 영어, 숫자, 기본 기호만 남기고 제거
            const cleanedText = text.replace(/[^\uAC00-\uD7A3\u1100-\u11FF\u0020-\u007E\n\r\t]/g, ' ')
                                   .replace(/\s+/g, ' ')
                                   .trim();

            if (cleanedText.length < 50) {
                // UTF-16 실패 시 일반 UTF-8 시도
                const altDecoder = new TextDecoder('utf-8');
                const altText = altDecoder.decode(arrayBuffer).replace(/[^\uAC00-\uD7A3\u0020-\u007E\n]/g, ' ');
                accumulatedParts.push({ text: `[구형 Word 파일: ${file.name} 내용 추출]\n${altText}` });
            } else {
                accumulatedParts.push({ text: `[구형 Word 파일: ${file.name} 내용 추출]\n${cleanedText}` });
            }
        }

        async function handleDocx(file) {
            const buffer = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: buffer });
            accumulatedParts.push({ text: `[Word 문서: ${file.name}]\n${res.value}` });
        }

        async function handlePdf(file) {
            const buffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(s => s.str).join(' ') + "\n";
            }
            accumulatedParts.push({ text: `[PDF 문서: ${file.name}]\n${text}` });
        }

        async function handleExcel(file) {
            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer);
            let txt = "";
            wb.SheetNames.forEach(n => { txt += `[시트: ${n}]\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n`; });
            accumulatedParts.push({ text: `[Excel 문서: ${file.name}]\n${txt}` });
        }

        async function handleImage(file) {
            const base64 = await new Promise(r => {
                const rd = new FileReader();
                rd.onload = () => r(rd.result.split(',')[1]);
                rd.readAsDataURL(file);
            });
            accumulatedParts.push({ inlineData: { mimeType: file.type, data: base64 } });
        }

        generateBtn.addEventListener('click', async () => {
            const key = apiKeyInput.value.trim();
            setLoading(true);
            const instruction = document.getElementById('userInstruction').value;
            const finalParts = [...accumulatedParts];
            if (instruction) finalParts.push({ text: `\n[사용자 추가 요청]: ${instruction}` });

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: finalParts }] })
                });
                const data = await response.json();
                const md = data.candidates[0].content.parts[0].text;
                previewContainer.innerHTML = marked.parse(md);
                downloadBtn.disabled = false;
            } catch (err) {
                alert("생성 실패: API 키를 확인해주세요.");
            } finally {
                setLoading(false);
            }
        });

        function checkEnableButton() { generateBtn.disabled = !(apiKeyInput.value && accumulatedParts.length); }
        function setLoading(l) { 
            generateBtn.disabled = l; 
            document.getElementById('spinner').classList.toggle('hidden', !l);
            document.getElementById('btnText').textContent = l ? "AI 작성 중..." : "기안문 생성하기";
        }

        downloadBtn.addEventListener('click', () => {
            const html = previewContainer.innerHTML;
            const blob = new Blob(['<html><head><meta charset="utf-8"></head><body>' + html + '</body></html>'], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '기안문_드래프트.doc';
            a.click();
        });
    </script>
</body>
</html>
