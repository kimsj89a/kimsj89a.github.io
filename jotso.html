    // --- 2. 로고 그리기 함수 ---
    function drawLogo(canvasId, text) {
        const canvas = document.getElementById(canvasId);
        const ctx = canvas.getContext("2d");
        
        ctx.fillStyle = "#ffffff";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.beginPath();
        ctx.ellipse(canvas.width / 2, canvas.height / 2, canvas.width / 2 - 10, canvas.height / 2 - 20, 0, 0, 2 * Math.PI);
        ctx.fillStyle = "#0000FF";
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.font = "bold 24px Gulim";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(text, canvas.width / 2, canvas.height / 2);
        
        ctx.font = "12px Gulim";
        ctx.fillStyle = "black";
        ctx.fillText("(주)", 20, 20);
    }

    // --- 3. 판독기 로직 ---
    function evaluateCompany() {
        const name = document.getElementById("inputName").value.trim();
        if (!name) { alert("회사 이름을 입력해라 친구야."); return; }

        let score = 0;
        let keywords = [];

        prefixes.forEach(p => {
            if (name.includes(p)) { score += 30; keywords.push(p); }
        });
        suffixes.forEach(s => {
            if (name.toLowerCase().includes(s.toLowerCase())) { score += 30; keywords.push(s); }
        });
        
        const pangyoWords = ["랩", "소프트", "스튜디오", "Lab", "Soft", "Studio", "AI", "플랫폼"];
        pangyoWords.forEach(w => {
            if (name.toLowerCase().includes(w.toLowerCase())) { score -= 15; keywords.push("판교감성(-15)"); }
        });

        let grade, comment;
        if (score >= 80) {
            grade = "👑 전설의 좃소 (S급)";
            comment = "야근수당? 그게 뭐죠? 먹는 건가요?";
        } else if (score >= 40) {
            grade = "🏭 든든한 중소 (A급)";
            comment = "사장님 차는 벤츠, 내 차는 마을버스.";
        } else {
            grade = "🌱 스타트업 호소인 (B급)";
            comment = "아직 배가 불렀음. 이름을 더 투박하게 지으세요.";
        }

        const resultBox = document.getElementById("evalResult");
        resultBox.style.display = "block";
        document.getElementById("evalText").innerHTML = `
            <div class='score'>좃소력: ${score}점</div>
            <b>등급:</b> ${grade}<br>
            <b>발견된 키워드:</b> ${keywords.join(", ") || "없음"}<br>
            <br>
            <span class='blink'>[한줄평] ${comment}</span>
        `;
        drawLogo("evalLogo", name);
    }

    // --- 4. 랜덤 작명기 로직 (업데이트) ---
    function generateName() {
        const isLegendary = Math.random() < 0.2;
        let name = "";
        
        const p1 = prefixes[Math.floor(Math.random() * prefixes.length)];
        const s1 = suffixes[Math.floor(Math.random() * suffixes.length)];
        
        if (isLegendary) {
            let p2 = prefixes[Math.floor(Math.random() * prefixes.length)];
            while(p1 === p2) { p2 = prefixes[Math.floor(Math.random() * prefixes.length)]; }
            name = p1 + p2 + s1;
        } else {
            name = p1 + s1;
        }

        // 업종 찾기 (접미사 기준)
        let bizType = businessTypes["Default"];
        for (const key in businessTypes) {
            if (s1.includes(key) || key.includes(s1)) {
                bizType = businessTypes[key];
                break;
            }
        }

        // 랜덤 특징 추출
        const randomFeature = randomFeatures[Math.floor(Math.random() * randomFeatures.length)];
        
        // 사훈 추출

        resultBox.style.display = "block";
