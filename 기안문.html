<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기안문 작성 도우미 (AI Powered)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        /* [수정] user-select: none 삭제하여 텍스트 선택 허용 */
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* A4 Paper Preview Styles */
        .preview-wrapper {
            background-color: #e5e7eb;
            padding: 2rem;
            height: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .a4-page {
            background-color: white;
            width: 210mm;
            min-height: 297mm;
            padding: 25mm 20mm;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: #000;
            font-family: 'Malgun Gothic', sans-serif;
            line-height: 1.6;
            font-size: 11pt;
            word-break: keep-all;
            user-select: text; /* 텍스트 선택 명시적 허용 */
        }

        /* Markdown Styles simulating Word Document */
        .a4-page h1 { font-size: 2.2em; font-weight: bold; text-align: center; margin-bottom: 30px; letter-spacing: -0.5px; }
        .a4-page h2 { font-size: 1.4em; font-weight: bold; margin-top: 25px; margin-bottom: 10px; }
        .a4-page h3 { font-size: 1.2em; font-weight: bold; margin-top: 15px; margin-bottom: 8px; }
        .a4-page p { margin-bottom: 8px; text-align: justify; }
        .a4-page ul, .a4-page ol { margin-bottom: 10px; padding-left: 20px; }
        .a4-page ul { list-style-type: disc; }
        .a4-page ol { list-style-type: decimal; }

        .a4-page table { border-collapse: collapse; width: 100%; margin: 15px 0; border: 1px solid #000; font-size: 0.9em; }
        .a4-page th, .a4-page td { border: 1px solid #000; padding: 0px 8px; height: 30px; vertical-align: middle; }
        .a4-page th { background-color: #f3f4f6; font-weight: bold; text-align: center; }
        .a4-page strong { font-weight: bold; }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col"> <header class="bg-white border-b border-gray-200 sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <div class="bg-blue-600 text-white p-1.5 rounded-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                </div>
                <h1 class="text-xl font-bold text-gray-900">기안문 작성 도우미</h1>
            </div>
            <div class="text-sm text-gray-500">Powered by Gemini</div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 h-full">
            
            <div class="lg:col-span-1 space-y-6">
                
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-900 flex items-center gap-2">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                                <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd" />
                            </svg>
                            설정
                        </h2>
                    </div>

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-gray-700 mb-1">Gemini API Key</label>
                        <div class="relative">
                            <input type="password" id="apiKeyInput" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors pr-10" placeholder="AI Studio Key 입력">
                            <button id="saveKeyBtn" class="absolute inset-y-0 right-0 px-3 flex items-center text-gray-400 hover:text-blue-600" title="브라우저에 저장">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
                                </svg>
                            </button>
                        </div>
                        <p class="text-xs text-gray-500 mt-1" id="keyStatus">키를 입력하면 브라우저에 자동 저장됩니다.</p>
                    </div>

                    <div class="bg-blue-50 border border-blue-100 rounded-lg p-4 text-sm text-blue-800">
                        <p class="font-medium mb-1">지원 기능:</p>
                        <ul class="list-disc list-inside space-y-1 text-blue-700 opacity-90 text-xs">
                            <li>다중 파일 업로드 (PDF, Word, Excel, 이미지)</li>
                            <li><strong>HWP</strong>는 PDF로 변환하여 업로드</li>
                            <li>텍스트 인식 불가 시 <strong>자동 이미지 분석</strong></li>
                        </ul>
                    </div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M3 17a1 1 0 011-1h12a1 1 0 110 2H4a1 1 0 01-1-1zM6.293 6.707a1 1 0 010-1.414l3-3a1 1 0 011.414 0l3 3a1 1 0 01-1.414 1.414L11 5.414V13a1 1 0 11-2 0V5.414L7.707 6.707a1 1 0 01-1.414 0z" clip-rule="evenodd" />
                        </svg>
                        파일 업로드 (Drag & Drop)
                    </h2>
                    
                    <div class="flex items-center justify-center w-full">
                        <label id="dropZone" for="multiFile" class="flex flex-col items-center justify-center w-full h-32 border-2 border-gray-300 border-dashed rounded-lg cursor-pointer bg-gray-50 hover:bg-gray-100 transition-colors">
                            <div class="flex flex-col items-center justify-center pt-5 pb-6">
                                <svg class="w-8 h-8 mb-3 text-gray-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 20 16">
                                    <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 13h3a3 3 0 0 0 0-6h-.025A5.56 5.56 0 0 0 16 6.5 5.5 5.5 0 0 0 5.207 5.021C5.137 5.017 5.071 5 5 5a4 4 0 0 0 0 8h2.167M10 15V6m0 0L8 8m2-2 2 2"/>
                                </svg>
                                <p class="text-sm text-gray-500"><span class="font-semibold">클릭 또는 파일 드래그</span></p>
                                <p class="text-xs text-gray-500">PDF, Word, Excel, 이미지</p>
                            </div>
                            <input id="multiFile" type="file" class="hidden" multiple accept=".pdf,.docx,.doc,.xlsx,.xls,.jpg,.jpeg,.png,.hwp" />
                        </label>
                    </div>
                    
                    <div id="fileList" class="mt-4 space-y-2 text-sm text-gray-600 max-h-40 overflow-y-auto hidden"></div>
                </div>

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4 flex items-center gap-2">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-gray-500" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />
                        </svg>
                        추가 요청사항
                    </h2>
                    <div class="mb-1">
                        <textarea id="userInstruction" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors text-sm" placeholder="예: 어조를 조금 더 부드럽게 해줘, 결론을 먼저 써줘 등"></textarea>
                    </div>
                </div>

                <button id="generateBtn" disabled class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-gray-300 disabled:cursor-not-allowed text-white font-medium py-3 px-4 rounded-xl shadow-sm transition-all flex items-center justify-center gap-2">
                    <span id="btnText">기안문 생성하기</span>
                    <div id="spinner" class="loader hidden"></div>
                </button>
            </div>

            <div class="lg:col-span-2 flex flex-col h-full min-h-[500px]">
                <div class="bg-white rounded-xl shadow-sm border border-gray-200 flex flex-col h-full overflow-hidden">
                    <div class="border-b border-gray-200 px-6 py-4 flex items-center justify-between bg-gray-50">
                        <h2 class="text-lg font-semibold text-gray-900">📄 문서 미리보기</h2>
                        <div class="flex items-center gap-2">
                            <button id="openStyleModal" class="text-sm bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-3 py-2 rounded-lg transition-colors flex items-center gap-2">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                                </svg>
                                문서 스타일 설정
                            </button>
                            <button id="downloadBtn" disabled class="text-sm bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 px-4 py-2 rounded-lg transition-colors flex items-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                                </svg>
                                Word 다운로드
                            </button>
                        </div>
                    </div>
                    
                    <div class="preview-wrapper" id="previewWrapper">
                        <div id="previewContainer" class="a4-page">
                            <div class="h-full flex flex-col items-center justify-center text-gray-400 space-y-3" style="min-height: 200mm;">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-16 w-16 opacity-20" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                                </svg>
                                <p>왼쪽에서 파일을 업로드하고 생성 버튼을 눌러주세요.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="styleModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50 hidden">
        <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
            <div class="flex justify-between items-center mb-4 border-b pb-2">
                <h3 class="text-lg font-bold text-gray-900">문서 스타일 설정</h3>
                <button id="closeStyleModal" class="text-gray-500 hover:text-gray-700">
                    <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">기본 폰트 (Font Family)</label>
                    <select id="styleFont" class="block w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        <option value="'Malgun Gothic', sans-serif" selected>맑은 고딕</option>
                        <option value="'Batang', serif">바탕 (명조)</option>
                        <option value="'Dotum', sans-serif">돋움</option>
                        <option value="'Gulim', sans-serif">굴림</option>
                        <option value="'Noto Sans KR', sans-serif">Noto Sans KR</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">글자 크기 (Font Size)</label>
                    <select id="styleSize" class="block w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        <option value="10pt">10pt</option>
                        <option value="11pt" selected>11pt (기본)</option>
                        <option value="12pt">12pt</option>
                        <option value="13pt">13pt</option>
                    </select>
                </div>
                 <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">줄 간격 (Line Height)</label>
                    <select id="styleLineHeight" class="block w-full border-gray-300 rounded-md shadow-sm p-2 border focus:ring-blue-500 focus:border-blue-500">
                        <option value="1.4">1.4 (좁게)</option>
                        <option value="1.6" selected>1.6 (보통)</option>
                        <option value="1.8">1.8 (넓게)</option>
                        <option value="2.0">2.0 (매우 넓게)</option>
                    </select>
                </div>
            </div>

            <div class="flex justify-end pt-2">
                <button id="saveStyleBtn" class="px-4 py-2 bg-blue-600 text-white font-medium rounded-md hover:bg-blue-700 transition-colors w-full">
                    적용하기
                </button>
            </div>
        </div>
    </div>

    <script>
        // [수정] 보안 관련 차단 스크립트 삭제 (복사를 가능하게 하기 위함)

        // --- CONFIGURATION ---
        const DEFAULT_API_KEY = ""; 

        // FIXED SYSTEM PROMPT
        const SYSTEM_PROMPT = `당신은 '기안문 작성 도우미'입니다. 사용자가 제공하는 내용과 참고 자료를 기반으로 기안문을 작성합니다. [공통 지침 생략]`;

        // Style State
        let currentStyles = {
            fontFamily: "'Malgun Gothic', sans-serif",
            fontSize: "11pt",
            lineHeight: "1.6"
        };

        // --- DOM Elements ---
        const apiKeyInput = document.getElementById('apiKeyInput');
        const keyStatus = document.getElementById('keyStatus');
        const saveKeyBtn = document.getElementById('saveKeyBtn');
        const fileInput = document.getElementById('multiFile');
        const dropZone = document.getElementById('dropZone');
        const fileListDisplay = document.getElementById('fileList');
        const userInstructionInput = document.getElementById('userInstruction');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        // Style Modal Elements
        const openStyleModalBtn = document.getElementById('openStyleModal');
        const styleModal = document.getElementById('styleModal');
        const closeStyleModalBtn = document.getElementById('closeStyleModal');
        const saveStyleBtn = document.getElementById('saveStyleBtn');
        const styleFontInput = document.getElementById('styleFont');
        const styleSizeInput = document.getElementById('styleSize');
        const styleLineHeightInput = document.getElementById('styleLineHeight');

        let accumulatedParts = [];

        // --- Logic (생략 없이 유지) ---
        window.addEventListener('load', () => {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                apiKeyInput.value = savedKey;
                keyStatus.textContent = '저장된 API 키를 불러왔습니다.';
                keyStatus.classList.add('text-blue-600');
            } else {
                apiKeyInput.value = DEFAULT_API_KEY;
            }
            checkEnableButton();
        });

        function saveApiKey() {
            const key = apiKeyInput.value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                keyStatus.textContent = 'API 키가 안전하게 저장되었습니다.';
                keyStatus.classList.add('text-blue-600');
            }
            checkEnableButton();
        }

        saveKeyBtn.addEventListener('click', saveApiKey);

        openStyleModalBtn.addEventListener('click', () => {
            styleFontInput.value = currentStyles.fontFamily;
            styleSizeInput.value = currentStyles.fontSize;
            styleLineHeightInput.value = currentStyles.lineHeight;
            styleModal.classList.remove('hidden');
        });

        const closeStyleModal = () => styleModal.classList.add('hidden');
        closeStyleModalBtn.addEventListener('click', closeStyleModal);

        saveStyleBtn.addEventListener('click', () => {
            currentStyles.fontFamily = styleFontInput.value;
            currentStyles.fontSize = styleSizeInput.value;
            currentStyles.lineHeight = styleLineHeightInput.value;
            updatePreviewStyles();
            closeStyleModal();
        });

        function updatePreviewStyles() {
            const page = document.getElementById('previewContainer');
            if(page) {
                page.style.fontFamily = currentStyles.fontFamily;
                page.style.fontSize = currentStyles.fontSize;
                page.style.lineHeight = currentStyles.lineHeight;
            }
        }

        // --- File & API Logic (기존 로직 유지) ---
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;
            accumulatedParts = [];
            fileListDisplay.innerHTML = '';
            fileListDisplay.classList.remove('hidden');
            setLoading(true, "파일 분석 중...");
            for (const file of files) {
                const statusEl = document.createElement('div');
                statusEl.className = "flex justify-between items-center p-2 bg-gray-50 rounded";
                statusEl.innerHTML = `<span>${file.name}</span> <span class="text-xs text-gray-500">처리 중...</span>`;
                fileListDisplay.appendChild(statusEl);
                try {
                    await processFile(file);
                    statusEl.querySelector('span:last-child').textContent = "완료";
                    statusEl.querySelector('span:last-child').classList.add("text-blue-600");
                } catch (err) {
                    statusEl.querySelector('span:last-child').textContent = "실패";
                }
            }
            checkEnableButton();
            setLoading(false, "기안문 생성하기");
        });

        generateBtn.addEventListener('click', async () => {
            const currentKey = apiKeyInput.value.trim();
            setLoading(true, "AI 작성 중...");
            const instruction = userInstructionInput.value.trim();
            let finalParts = [...accumulatedParts];
            if (instruction) finalParts.push({ text: `\n\n[요청사항]: ${instruction}` });
            try {
                const resultMarkdown = await callGemini(currentKey, finalParts);
                renderPreview(resultMarkdown);
                downloadBtn.disabled = false;
            } catch (err) {
                alert(`오류: ${err.message}`);
            } finally {
                setLoading(false);
            }
        });

        async function callGemini(apiKey, parts) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    contents: [{ parts: parts }],
                    systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
                })
            });
            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        function renderPreview(markdown) {
            previewContainer.innerHTML = marked.parse(markdown);
            updatePreviewStyles();
        }

        // --- File Processing Functions (기존과 동일) ---
        async function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();
            if (ext === 'pdf') await handlePdf(file);
            else if (['jpg', 'jpeg', 'png'].includes(ext)) await handleImage(file);
            else if (['docx', 'doc'].includes(ext)) await handleDocx(file);
            else if (['xlsx', 'xls'].includes(ext)) await handleExcel(file);
            else {
                const text = await readFileAsText(file);
                accumulatedParts.push({ text: `[File: ${file.name}]\n${text}` });
            }
        }

        async function handleImage(file) {
            const base64 = await readFileAsBase64(file);
            accumulatedParts.push({ inlineData: { mimeType: file.type, data: base64.split(',')[1] } });
        }

        async function handlePdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let text = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const content = await page.getTextContent();
                text += content.items.map(s => s.str).join(' ') + "\n";
            }
            accumulatedParts.push({ text: `[PDF: ${file.name}]\n${text}` });
        }

        async function handleDocx(file) {
            const buffer = await file.arrayBuffer();
            const res = await mammoth.extractRawText({ arrayBuffer: buffer });
            accumulatedParts.push({ text: `[Word: ${file.name}]\n${res.value}` });
        }

        async function handleExcel(file) {
            const buffer = await file.arrayBuffer();
            const wb = XLSX.read(buffer);
            let txt = "";
            wb.SheetNames.forEach(n => {
                txt += `[Sheet: ${n}]\n${XLSX.utils.sheet_to_csv(wb.Sheets[n])}\n`;
            });
            accumulatedParts.push({ text: `[Excel: ${file.name}]\n${txt}` });
        }

        function readFileAsBase64(f) { return new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsDataURL(f); }); }
        function readFileAsText(f) { return new Promise(r => { const rd = new FileReader(); rd.onload = () => r(rd.result); rd.readAsText(f); }); }
        function checkEnableButton() { generateBtn.disabled = !(apiKeyInput.value.trim() && accumulatedParts.length); }
        function setLoading(l, t = "기안문 생성하기") { generateBtn.disabled = l; spinner.classList.toggle('hidden', !l); btnText.textContent = t; }

        downloadBtn.addEventListener('click', () => {
            const html = previewContainer.innerHTML;
            const blob = new Blob(['<html><head><meta charset="utf-8"></head><body>' + html + '</body></html>'], { type: 'application/msword' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = '기안문.doc';
            a.click();
        });
    </script>
</body>
</html>
