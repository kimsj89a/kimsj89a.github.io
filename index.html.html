    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body { font-family: 'Noto Sans KR', sans-serif; }
        
        /* A4 Paper Preview Styles */
        .preview-wrapper {
            background-color: #e5e7eb; /* Gray background */
            padding: 2rem;
            height: 100%;
            overflow-y: auto;
            display: flex;
            justify-content: center;
        }

        .a4-page {
            background-color: white;
            width: 210mm;
            min-height: 297mm;
            padding: 25mm 20mm; /* A4 Margins */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            color: #000;
            font-family: 'Malgun Gothic', 'Dotum', sans-serif;
            line-height: 1.6;
            font-size: 11pt;
            word-break: keep-all;
        }

        /* Markdown Styles simulating Word Document */
        .a4-page h1 {
            font-size: 22pt;
            font-weight: bold;
            text-align: center;
            margin-bottom: 30px;
            letter-spacing: -0.5px;
        }
        
        .a4-page h2 {
            font-size: 14pt;
            font-weight: bold;
            margin-top: 25px;
            margin-bottom: 10px;
        }
        
        .a4-page h3 {
            font-size: 12pt;
            font-weight: bold;
            margin-top: 15px;
            margin-bottom: 8px;
        }

        .a4-page p {
            margin-bottom: 8px;
            text-align: justify;
        }

        .a4-page ul, .a4-page ol {
            margin-bottom: 10px;
            padding-left: 20px;
        }

        .a4-page ul { list-style-type: disc; }
        .a4-page ol { list-style-type: decimal; }

        /* Table Styles (User requested) */
        .a4-page table {
            border-collapse: collapse;
            width: 100%;
            margin: 15px 0;
            border: 1px solid #000;
            font-size: 10pt;
        }
        
        .a4-page th, .a4-page td {
            border: 1px solid #000;
            padding: 0px 8px; /* Vertical padding removed */
            height: 30px; /* Min height for readability */
            vertical-align: middle;
        }
        
        .a4-page th {
            background-color: #f3f4f6;
            font-weight: bold;
            text-align: center;
        }

        .a4-page strong {
            font-weight: bold;
        }

        /* Loader */
        .loader {
            border: 3px solid #f3f3f3;
            border-radius: 50%;
            border-top: 3px solid #3b82f6;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-10">

                            <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd" />

    <script>
        // --- Configuration ---
        const SYSTEM_PROMPT = `
당신은 '기안문 작성 도우미'입니다. 사용자가 제공하는 내용과 참고 자료를 기반으로 기안문을 작성합니다.


[기안문 공통 형식]
1. **제목:** [대상회사명] ~~~의 건(부연설명)

\n2. **내용:** 공식 문체 사용 (예: "~하고자 하오니 재가하여 주시기 바랍니다.")

\n[지원하는 기안문 종류 및 지침]
**사전 동의:** 피투자회사의 요청사항에 대해 사전 동의 진행 시 작성.
**의결권 행사:** 주주총회 또는 이사회 의결권 행사 시 작성.
**NDA, LOI, LOC 등 문서 결재:** - NDA 작성 시 "반드시" 다음 형식을 따름 (이 경우 공통 형식의 '다음' 항목은 작성하지 않음):
     신규 프로젝트([프로젝트명])와 관련하여 다음의 NDA를 체결하고자 하오니 승인하여 주시기 바랍니다.
     
     비밀유지확약서(NDA) 체결의 건
     - 체결 대상자: [대상자 정보]
     - 투자 검토대상: [대상 투자 또는 검토 정보]
     - 내용: 본 건과 관련하여 비밀유지 의무
     - 체결 기간 및 특이사항: [계약 기간 및 특이사항]
     
     **[NDA 체크리스트]**
     | 체크리스트 항목 | 답변 |
     |---|---|
     | 1 비밀유지의무가 일방적인가, 아니면 상호적인가? | [일방 or 상호] |
     | 2 비밀유지대상의 정의가 명확히 기재되어 있는가? | [Y/N] |
     | 3 비밀정보의 범위 내 잔존정보가 포함되는가? | [Y/N] |
     | 4 비밀정보의 사용 목적이 특정되어 있는가? | [Y/N] |
     | 5 비밀유지 의무의 내용이 구체적으로 명시되어 있는가? | [Y/N] |
     | 6 계약 종료 시, 비밀정보 반환/폐기 확인서를 제출해야 하는가? | [Y/N] |
     | 7 계약 위반 시, 손해배상액의 규모가 구체적이지 않은가? | [Y/N] |
     | 8 그 외 특이 조항이 존재하는가? | [Y/N] |

**다음:** 주요 항목을 나열하며 **음슴체** 사용. (**단, NDA 작성 시에는 이 '다음' 항목을 절대 생성하지 말고 생략하시오.**)
   - **목적:** 기안 목적 명확화.
   - **주요 내용 요약:** 주요 내용 정리.
   - **의견:** 분석적 의견과 향후 조치사항 등 능동적이고 확정적인 어조**로 작성.

**붙임:** 첨부 자료 명시. 양식은
붙임1. 
붙임2. 
~
붙임n.[첨부파일제목].끝.


[주의사항]
- 여러 파일이 제공된 경우 내용을 종합하여 하나의 완결된 기안문을 작성하십시오.
- 이미지가 포함된 경우 이미지 내의 텍스트를 읽고 내용을 반영하십시오.
`;

        // --- DOM Elements ---
        const fileInput = document.getElementById('multiFile');
        const dropZone = document.getElementById('dropZone');
        const fileListDisplay = document.getElementById('fileList');
        const apiKeyInput = document.getElementById('apiKeyInput');
        const userInstructionInput = document.getElementById('userInstruction');
        const generateBtn = document.getElementById('generateBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const previewContainer = document.getElementById('previewContainer');
        const downloadBtn = document.getElementById('downloadBtn');

        let accumulatedParts = []; // Stores text and inlineData parts

        // --- Drag & Drop Event Listeners ---
        
        // Prevent default drag behaviors
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
            document.body.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // Highlight drop zone
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('border-blue-500', 'bg-blue-50');
            dropZone.classList.remove('border-gray-300', 'bg-gray-50');
        }

        function unhighlight(e) {
            dropZone.classList.remove('border-blue-500', 'bg-blue-50');
            dropZone.classList.add('border-gray-300', 'bg-gray-50');
        }

        // Handle dropped files
        dropZone.addEventListener('drop', handleDrop, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            
            if (files.length > 0) {
                fileInput.files = files; // Assign dropped files to input
                // Trigger change event to reuse existing logic
                const event = new Event('change');
                fileInput.dispatchEvent(event);
            }
        }

        // --- Existing Event Listeners ---
        
        fileInput.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            // Reset
            accumulatedParts = [];
            fileListDisplay.innerHTML = '';
            fileListDisplay.classList.remove('hidden');
            
            setLoading(true, "파일 분석 중...");
            
            try {
                for (const file of files) {
                    const statusEl = document.createElement('div');
                    statusEl.className = "flex justify-between items-center p-2 bg-gray-50 rounded";
                    statusEl.innerHTML = `<span>${file.name}</span> <span class="text-xs text-gray-500">처리 중...</span>`;
                    fileListDisplay.appendChild(statusEl);

                    try {
                        await processFile(file);
                        statusEl.querySelector('span:last-child').textContent = "완료";
                        statusEl.querySelector('span:last-child').classList.add("text-blue-600");
                    } catch (err) {
                        statusEl.querySelector('span:last-child').textContent = "실패/지원불가";
                        statusEl.querySelector('span:last-child').classList.add("text-red-500");
                        console.error(`Error processing ${file.name}:`, err);
                    }
                }
                
                checkEnableButton();
            } catch (err) {
                console.error(err);
                alert("파일 처리 중 오류가 발생했습니다.");
            } finally {
                setLoading(false, "기안문 생성하기");
            }
        });

        apiKeyInput.addEventListener('input', checkEnableButton);

        generateBtn.addEventListener('click', async () => {
            const apiKey = apiKeyInput.value.trim();
            if (!apiKey || accumulatedParts.length === 0) return;

            setLoading(true, "AI 작성 중...");
            downloadBtn.disabled = true;

            // 추가 요청사항 가져오기
            const instruction = userInstructionInput.value.trim();
            
            // 기존 parts 복사본 생성 후 요청사항 추가
            let finalParts = [...accumulatedParts];
            if (instruction) {
                finalParts.push({ text: `\n\n[사용자 추가 요청사항]: ${instruction}\n위 요청사항을 반드시 반영하여 기안문을 작성해주세요.` });
            }

            try {
                const resultMarkdown = await callGemini(apiKey, finalParts);
                renderPreview(resultMarkdown);
                downloadBtn.disabled = false;
            } catch (err) {
                console.error(err);
                alert(`오류 발생: ${err.message}`);
            } finally {
                setLoading(false);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const content = previewContainer.innerHTML;
            if (!content || content.includes("왼쪽에서 파일을")) return;
            downloadDocx(content);
        });

        // --- Logic ---

        function checkEnableButton() {
            if (accumulatedParts.length > 0 && apiKeyInput.value.trim().length > 0) {
                generateBtn.disabled = false;
            } else {
                generateBtn.disabled = true;
            }
        }

        function setLoading(isLoading, text = "기안문 생성하기") {
            if (isLoading) {
                generateBtn.disabled = true;
                spinner.classList.remove('hidden');
                btnText.textContent = text;
            } else {
                if (accumulatedParts.length > 0 && apiKeyInput.value.trim().length > 0) {
                    generateBtn.disabled = false;
                }
                spinner.classList.add('hidden');
                btnText.textContent = text;
            }
        }

        // --- File Processing Router ---
        async function processFile(file) {
            const ext = file.name.split('.').pop().toLowerCase();

            if (ext === 'pdf') {
                await handlePdf(file);
            } else if (['jpg', 'jpeg', 'png', 'webp'].includes(ext)) {
                await handleImage(file);
            } else if (['docx', 'doc'].includes(ext)) {
                await handleDocx(file);
            } else if (['xlsx', 'xls'].includes(ext)) {
                await handleExcel(file);
            } else if (ext === 'hwp') {
                alert(`[${file.name}] HWP 파일은 브라우저에서 직접 읽을 수 없습니다. PDF로 저장하여 업로드해주세요.`);
                throw new Error("HWP Not Supported");
            } else {
                // Try as text for other files
                const text = await readFileAsText(file);
                accumulatedParts.push({ text: `[File: ${file.name}]\n${text}` });
            }
        }

        // 1. Image Handler
        async function handleImage(file) {
            const base64Data = await readFileAsBase64(file);
            // Remove header (data:image/xxx;base64,)
            const data = base64Data.split(',')[1]; 
            const mimeType = file.type || 'image/jpeg';
            
            accumulatedParts.push({
                inlineData: {
                    mimeType: mimeType,
                    data: data
                }
            });
            accumulatedParts.push({ text: `\n[이미지 파일: ${file.name} 참조]\n` });
        }

        // 2. PDF Handler (Text + Image Fallback)
        async function handlePdf(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            let pagesAsImages = [];

            // Try Text Extraction First
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                fullText += pageText + "\n";

                // If text is very sparse (e.g., scanned), render page to image
                if (pageText.length < 50) {
                    const viewport = page.getViewport({ scale: 1.5 });
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.height = viewport.height;
                    canvas.width = viewport.width;

                    await page.render({ canvasContext: context, viewport: viewport }).promise;
                    const imgDataUrl = canvas.toDataURL('image/jpeg');
                    pagesAsImages.push({
                        mimeType: 'image/jpeg',
                        data: imgDataUrl.split(',')[1]
                    });
                }
            }

            if (fullText.trim().length > 100 && pagesAsImages.length === 0) {
                // Good text extraction
                accumulatedParts.push({ text: `[File: ${file.name}]\n${fullText}` });
            } else {
                // Fallback to Images (or mixed)
                console.log(`PDF ${file.name} appears to be scanned/image-based. Sending as images.`);
                accumulatedParts.push({ text: `[File: ${file.name} (이미지/스캔본)]` });
                
                // Add all pages as images (limit to first 5 to avoid payload limits if huge)
                for (const imgPart of pagesAsImages) {
                    accumulatedParts.push({ inlineData: imgPart });
                }
                
                // If we extracted some text (even if messy), add it too as context
                if (fullText.trim().length > 0) {
                    accumulatedParts.push({ text: `[Extracted Text Context]:\n${fullText}` });
                }
            }
        }

        // 3. DOCX Handler
        async function handleDocx(file) {
            const arrayBuffer = await file.arrayBuffer();
            const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
            accumulatedParts.push({ text: `[File: ${file.name}]\n${result.value}` });
        }

        // 4. Excel Handler
        async function handleExcel(file) {
            const arrayBuffer = await file.arrayBuffer();
            const workbook = XLSX.read(arrayBuffer);
            let combinedText = "";
            
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                const csv = XLSX.utils.sheet_to_csv(worksheet);
                combinedText += `[Sheet: ${sheetName}]\n${csv}\n`;
            });
            
            accumulatedParts.push({ text: `[File: ${file.name}]\n${combinedText}` });
        }

        // Utilities
        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        function readFileAsText(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = reject;
                reader.readAsText(file);
            });
        }

        // Gemini API Call
        async function callGemini(apiKey, parts) {
            // 사용자의 요청대로 모델 버전을 gemini-3-flash-preview로 변경
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{
                    parts: parts 
                }],
                systemInstruction: {
                    parts: [{ text: SYSTEM_PROMPT }]
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API 호출 실패');
            }

            const data = await response.json();
            return data.candidates[0].content.parts[0].text;
        }

        // Render & Download
        function renderPreview(markdown) {
            const htmlContent = marked.parse(markdown);
            previewContainer.innerHTML = htmlContent;
        }

        function downloadDocx(htmlContent) {
            const header = `
                <html xmlns:o='urn:schemas-microsoft-com:office:office' 
                      xmlns:w='urn:schemas-microsoft-com:office:word' 
                      xmlns='http://www.w3.org/TR/REC-html40'>
                <head>
                    <meta charset="utf-8">
                    <title>기안문</title>
                    <style>
                        body { font-family: 'Malgun Gothic', sans-serif; }
                        h1 { font-size: 22pt; font-weight: bold; text-align: center; margin-bottom: 30px; }
                        h2 { font-size: 14pt; font-weight: bold; margin-top: 25px; margin-bottom: 10px; }
                        h3 { font-size: 12pt; font-weight: bold; margin-top: 15px; }
                        p { margin-bottom: 8px; text-align: justify; line-height: 1.6; }
                        table { border-collapse: collapse; width: 100%; margin-bottom: 20px; font-size: 10pt; }
                        td, th { border: 1px solid #000; padding: 0px 8px; height: 30px; vertical-align: middle; }
                        th { background-color: #f0f0f0; text-align: center; font-weight: bold; }
                        ul, ol { margin-bottom: 10px; }
                    </style>
                </head><body>`;
            const footer = "</body></html>";
            const sourceHTML = header + htmlContent + footer;
            const source = 'data:application/vnd.ms-word;charset=utf-8,' + encodeURIComponent(sourceHTML);
            const fileDownload = document.createElement("a");
            document.body.appendChild(fileDownload);
            fileDownload.href = source;
            fileDownload.download = '기안문_draft.doc';
            fileDownload.click();
            document.body.removeChild(fileDownload);
        }

        // API Key Helper
        const urlParams = new URLSearchParams(window.location.search);
        const urlKey = urlParams.get('key');
        if (urlKey) {
            apiKeyInput.value = urlKey;
            apiKeyInput.type = "password";
        }

    </script>
